name: Daily Intraday Bot

on:
  schedule:
    - cron: '30 3 * * *'  # Morning 9:00 AM IST
    - cron: '0 10 * * *'  # Afternoon / Market hours update
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        run: python bot.py
        
